name: Commercial API CI
on:
  push:
    paths:
      - 'server/**'
      - 'docker-compose.commercial.yml'
      - '.github/workflows/commercial-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'docker-compose.commercial.yml'
      - '.github/workflows/commercial-ci.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install server dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck API and processor
        run: npm run typecheck
      - name: Unit and security tests
        run: npm test
      - name: Build API and processor
        run: npm run build
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build deployable image
        run: docker build --tag deaify-server:ci server
